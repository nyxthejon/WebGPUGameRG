<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>glTF</title>
    <script type="importmap">
    {
        "imports": {
            "engine/": "../../../engine/",
            "dat": "../../../lib/dat.js",
            "glm": "../../../lib/glm.js"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
    <script type="script" src="overlay.js"></script>
    <link rel="stylesheet" href="../../../engine/style.css">
    <style>
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 80px;
            height: 80px;
            border: 8px solid rgba(255, 0, 0, 0.3);
            border-top-color: #ff0000;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
            box-shadow: 0 0 30px #ff0000, 0 0 60px rgba(255, 0, 0, 0.5);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
                box-shadow: 0 0 30px #ff0000, 0 0 60px rgba(255, 0, 0, 0.5);
            }
            50% {
                transform: rotate(180deg);
                box-shadow: 0 0 60px #ff4500, 0 0 90px rgba(255, 69, 0, 0.5);
            }
            100% {
                transform: rotate(360deg);
                box-shadow: 0 0 30px #ff0000, 0 0 60px rgba(255, 0, 0, 0.5);
            }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
    </div>

    <div class="fullscreen no-touch pixelated">
        <canvas></canvas>
        <div id="timer-container">
            <img id="timer-icon" src="../img/timer.png" alt="Timer Icon">
            <span id="timer-text">120</span>
        </div>

        <div id="antNumber-container">
            <img id="antNumber-icon" src="../img/ant.png" alt="ant Icon">
            <span id="antNumber-text">10</span>
        </div>

        <div id="gameover-overlay">
            <div id="gameover-title">Game Over</div>
            <div id="gameover-title-win">You won</div>
            <div id="gameover-score">1</div>
            <button id="restart-button" class="gameover-button">Restart</button>
            <button id="continue-button" class="gameover-button">Continue</button>
        </div>
    </div>
    <div id="crosshair"></div>
</body>
</html>
