<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ant Hill Haunt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: url('img/title.jpg') no-repeat center center;
      background-size: cover;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    .game-title {
      font-size: 5rem;
      font-family: 'Creepster', cursive;
      margin-bottom: 30px;
      color: #ff3e00;
      text-shadow: 4px 4px 6px rgba(0, 0, 0, 0.9);
    }

    .start-button {
      font-size: 1.5rem;
      padding: 15px 30px;
      background: #620000;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .start-button:hover {
      background: #8b0000;
      transform: scale(1.05);
    }

    .how-to-play {
      margin-top: 20px;
      font-size: 1.2rem;
      text-align: center;
      max-width: 600px;
      line-height: 1.6;
      color: #ffcccb;
    }
  </style>
</head>
<body>
  <h1 class="game-title">Ant Hill Haunt</h1>
  <a href="Game">
    <button class="start-button">Start Game</button>
  </a>
  <p class="how-to-play">W A S D to move, mouse to look around, left click to fire spray. The objective of the game is to find 10 ants before the timer runs out.</p>
</body>
</html>
