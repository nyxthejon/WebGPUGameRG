<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Start Screen</title>
  <style>
    /* Basic reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-size: cover;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    .game-title {
      font-size: 4rem;
      margin-bottom: 20px;
      text-shadow: 2px 2px #000;
    }

    .start-button {
      font-size: 1.2rem;
      padding: 10px 20px;
      background: #3f51b5;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.3s ease;
    }

    .start-button:hover {
      background: #303f9f;
    }
  </style>
</head>
<body>
  <a href="Game">
    <button class="start-button">Start Game</button>
  </a>
</body>
</html>
